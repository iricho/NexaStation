name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore NexaStation.sln
      - run: dotnet build NexaStation.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet test NexaStation.sln -c Release -p:Platform=x64 --no-build --no-restore
      - name: Verify unsigned x64 publish
        run: dotnet publish src/NexaStation.App/NexaStation.App.csproj -c Release -p:Platform=x64 -p:PublishSelfContainedApp=true --no-restore
