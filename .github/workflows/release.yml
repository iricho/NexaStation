name: Release alpha

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-msix:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: alpha-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Enforce license, notices, version, tag, and assets
        shell: pwsh
        run: ./eng/Test-ReleaseReadiness.ps1 -ReleaseTag '${{ github.ref_name }}'
      - name: Require protected signing inputs
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.NEXASTATION_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.NEXASTATION_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { throw 'Protected signing secrets are missing.' }
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'NexaStation.pfx'), [Convert]::FromBase64String($env:PFX_BASE64))
      - run: dotnet restore NexaStation.sln
      - run: dotnet build NexaStation.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet test NexaStation.sln -c Release -p:Platform=x64 --no-build --no-restore
      - name: Build signed x64 MSIX
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.NEXASTATION_PFX_PASSWORD }}
        run: dotnet publish src/NexaStation.App/NexaStation.App.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile="$env:RUNNER_TEMP\NexaStation.pfx" -p:PackageCertificatePassword="$env:PFX_PASSWORD" --no-restore
      - name: Hash release artifacts
        shell: pwsh
        run: Get-ChildItem artifacts/packages -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-File artifacts/packages/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexastation-${{ github.ref_name }}-signed
          path: artifacts/packages/**
          retention-days: 30
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'NexaStation.pfx') -Force -ErrorAction SilentlyContinue
