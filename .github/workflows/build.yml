name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore NexaStation.sln
      - run: dotnet build NexaStation.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet test NexaStation.sln -c Release -p:Platform=x64 --no-build --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Advisory synthetic benchmarks
        continue-on-error: true
        run: dotnet run --project benchmarks/NexaStation.Benchmarks/NexaStation.Benchmarks.csproj -c Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-results
          path: '**/TestResults/*.trx'
          retention-days: 14
          if-no-files-found: warn
